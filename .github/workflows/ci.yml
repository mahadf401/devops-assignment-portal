name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask pytest requests

      - name: Run Tests & Send Full JSON Report
        if: always()
        env:
          RECEIVER_URL: ${{ secrets.RECEIVER_URL }}
        run: |
          python run_tests.py

      # Bonus Task 2: Email Report (Runs on both passing and failing builds)
      - name: Send Email Test Report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI Report: ${{ github.repository }} (Commit: ${{ github.sha }})"
          to: ${{ secrets.RECIPIENT_EMAIL }}
          from: "GitHub Actions CI"
          body: |
            DevOps Assignment Portal CI Report
            ----------------------------------
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit SHA: ${{ github.sha }}
            Run ID: ${{ github.run_id }}
            Workflow Status: ${{ job.status }}

  # Bonus Task 1: Conditional Deployment to GitHub Pages
  deploy-pages:
    needs: test
    if: github.ref == 'refs/heads/main' && success()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './index_static'  # Folder containing your static HTML frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4