name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask pytest requests

      - name: Run Pytest
        id: run_tests
        continue-on-error: true
        run: |
          pytest > test_output.txt 2>&1
          echo "TEST_EXIT_CODE=$?" >> $GITHUB_ENV

      - name: Send Report Webhook
        if: always()
        env:
          RECEIVER_URL: ${{ secrets.RECEIVER_URL }}
        run: |
          if [ "$TEST_EXIT_CODE" -eq "0" ]; then
            STATUS="passed"
          else
            STATUS="failed"
          fi
          curl -X POST "$RECEIVER_URL" -H "Content-Type: application/json" -d "{\"status\":\"$STATUS\",\"repository\":\"$GITHUB_REPOSITORY\",\"commit\":\"$GITHUB_SHA\",\"run_id\":\"$GITHUB_RUN_ID\"}"

      - name: Enforce Test Success
        run: |
          if [ "$TEST_EXIT_CODE" -ne "0" ]; then
            exit 1
          fi